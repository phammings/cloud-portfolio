<text x="40" y="78" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#a3a3a3" text-anchor="start">Serverless portfolio on AWS: static React site + CMS API, deployed by GitHub Actions and Terraform</text>
