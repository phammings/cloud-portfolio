<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
<title id="t">ryanlepham.com architecture</title>
<desc id="d">Browser traffic goes through Route 53 and CloudFront to an S3 bucket for the site, and to an API Gateway HTTP API backed by one Python Lambda that reads and writes a single DynamoDB table, presigns S3 uploads, and logs in through Cognito. GitHub Actions deploys the frontend to S3 and the backend with Terraform.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3a3a3"/></marker></defs>
