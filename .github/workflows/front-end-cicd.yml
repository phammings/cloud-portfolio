name: frontend-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/front-end-cicd.yml'

# Never run two deploys at once; the newest push wins.
concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      # Hashed assets are cached for a year; index.html is always revalidated so deploys show up immediately.
      # media/ holds admin uploads and must never be deleted by the sync.
      - name: Upload to S3
        env:
          BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync dist "s3://$BUCKET" --delete --exclude 'media/*' --exclude index.html \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control 'no-cache'

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E1EV54Z8ZHZQ1K --paths '/*'
